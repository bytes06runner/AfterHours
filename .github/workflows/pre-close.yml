# Pre-close jobs for the free hosting setup (docs/HOSTING.md): the allocator bot's pre-close
# cycle and the Telegram pre-close alerts. The engine decides whether now is inside a pre-close
# window (schedule.pre_close_minutes before an exchange close, holidays and early closes
# included) and does nothing else otherwise.
#
# Why so many schedule entries: GitHub drops and delays scheduled runs on quiet repositories.
# An hourly schedule at minute 23 produced 32 runs between 2026-09-28 and 2026-10-07, at
# irregular times, and none of them inside a pre-close window. So the schedule now fires every
# 10 minutes across the hours that can hold a window: 18:00 to 20:59 UTC covers a regular close
# (20:00 UTC in daylight time, 21:00 UTC in standard time), and every 20 minutes from 15:00 to
# 17:59 UTC covers early closes (17:00 or 18:00 UTC). Off the round minutes, where GitHub is
# busiest. Runs outside a window only record a heartbeat. Scheduled workflows run only on the
# default branch, and GitHub disables them after 60 days without repository activity.
#
# Every run records a heartbeat, and every cycle a record (hold or act) in the shared store
# (engine/afterhours/bot/automation.py); `GET /v1/automation` reports them. A pre-close cycle
# runs once per close: later runs in the same window see the completed record and stop. A
# failed cycle fails the job and the next run in the window retries it.
#
# Missing configuration never fails the run: each job that lacks what it needs is skipped with a
# notice naming the secret or variable to add (Settings > Secrets and variables > Actions).
# setup-uv publishes no moving major tag after v7, so it is pinned to a full release tag.
name: Pre-close jobs

on:
  schedule:
    - cron: "7-59/10 18-20 * * 1-5"
    - cron: "7-59/20 15-17 * * 1-5"
  workflow_dispatch:
    inputs:
      force_cycle:
        description: "Run a manual cycle even outside a pre-close window (recorded as manual)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pre-close
  cancel-in-progress: false

jobs:
  pre-close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Which testnet vault the bot runs (a repository variable, not a secret).
      AFTERHOURS_ACTIVE_PROFILE: ${{ vars.AFTERHOURS_ACTIVE_PROFILE }}
      # Shared state with the API: bot history and Telegram subscriptions.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # Optional: empty means the public RPC from config.
      RH_MAINNET_RPC_URL: ${{ secrets.RH_MAINNET_RPC_URL }}
      RH_TESTNET_RPC_URL: ${{ secrets.RH_TESTNET_RPC_URL }}
      ARB_SEPOLIA_RPC_URL: ${{ secrets.ARB_SEPOLIA_RPC_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=()
          [ -n "$AFTERHOURS_ACTIVE_PROFILE" ] || missing+=("variable AFTERHOURS_ACTIVE_PROFILE")
          [ -n "$UPSTASH_REDIS_REST_URL" ] || missing+=("secret UPSTASH_REDIS_REST_URL")
          [ -n "$UPSTASH_REDIS_REST_TOKEN" ] || missing+=("secret UPSTASH_REDIS_REST_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Pre-close jobs skipped::Add these in Settings > Secrets and variables > Actions: $(IFS=,; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.config.outputs.ready == 'true'
      - name: Install the engine
        if: steps.config.outputs.ready == 'true'
        run: uv sync --frozen --no-dev
      - name: Heartbeat; inside a pre-close window?
        id: window
        if: steps.config.outputs.ready == 'true'
        # Prints true (in a window, cycle still to run), done (in a window, this close's cycle
        # already completed) or false (outside every window).
        run: |
          window=$(uv run --frozen --no-dev afterhours pre-close --heartbeat \
            --source "$GITHUB_EVENT_NAME" --run-ref "github-actions:$GITHUB_RUN_ID")
          echo "window=$window"
          if [ "$window" = true ] || [ "$window" = done ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$window" = true ] || [ "$FORCE_CYCLE" = true ]; then
            echo "cycle=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          FORCE_CYCLE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_cycle }}
      - name: Restore the price cache
        if: steps.window.outputs.cycle == 'true'
        uses: actions/cache@v6
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Refresh every Stock Token's prices
        if: steps.window.outputs.cycle == 'true'
        continue-on-error: true
        run: uv run --frozen --no-dev afterhours data fetch --stock-tokens > /dev/null
      - name: Bot pre-close cycle
        if: steps.window.outputs.cycle == 'true'
        env:
          ALLOCATOR_PK: ${{ secrets.ALLOCATOR_PK }}
          FORCE_CYCLE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_cycle }}
        run: |
          if [ -z "$ALLOCATOR_PK" ]; then
            echo "::notice title=Bot cycle skipped::Add the secret ALLOCATOR_PK to run the allocator bot."
            exit 0
          fi
          force=()
          [ "$FORCE_CYCLE" = true ] && force=(--force)
          uv run --frozen --no-dev afterhours bot due "${force[@]}" \
            --source "$GITHUB_EVENT_NAME" --run-ref "github-actions:$GITHUB_RUN_ID"
      - name: Telegram pre-close alerts
        if: always() && steps.window.outputs.due == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::notice title=Telegram alerts skipped::Add the secret TELEGRAM_BOT_TOKEN to send pre-close alerts."
            exit 0
          fi
          uv run --frozen --no-dev afterhours alerts check
