[project]
name = "afterhours"
version = "0.1.0"
description = "Afterhours risk engine, allocator bot and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
  "typer>=0.13",
]

[project.scripts]
afterhours = "afterhours.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterhours"]
