[project]
name = "afterhours-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["afterhours"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "agents"]

[tool.uv.sources]
afterhours = { workspace = true }
afterhours-mcp = { workspace = true }

[dependency-groups]
dev = [
  "afterhours-mcp",  # the MCP server (agents/), tested here; not installed on the API host
  "mypy>=1.13",
  "pandas-stubs>=3.0.5.260914",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML",
  "types-jsonschema",
  "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/lib", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = [
  "PLR0913", "PLR2004", "PLR0917", "PLR0912", "PLR0915", "PLR0914",
  "PLC0415",  # lazy imports keep the CLI fast; heavy modules load per command
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["engine/afterhours", "agents/afterhours_mcp"]
strict = true

[tool.pytest.ini_options]
testpaths = ["engine/tests", "agents/tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs anvil and forge; run with make test-integration"]

[tool.ruff.lint.isort]
known-first-party = ["afterhours", "afterhours_mcp"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pandas_market_calendars", "lightgbm", "scipy.*", "sklearn.*", "apscheduler.*", "rfc8785"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["eth_abi", "eth_utils"]
implicit_reexport = true
