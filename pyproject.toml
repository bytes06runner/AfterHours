[project]
name = "afterhours-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["afterhours"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
afterhours = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/lib", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["engine/afterhours"]
strict = true

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["afterhours"]
