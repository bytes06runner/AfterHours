[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 999999
# Fork tests read their RPC and block from the environment, which `make` fills from
# config/afterhours.yaml (fork_block) and .env (the RPC named by rpc_env).

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
