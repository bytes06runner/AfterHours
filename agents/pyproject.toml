[project]
name = "afterhours-mcp"
version = "0.1.0"
description = "Read-only weekend risk for Robinhood Stock Tokens, as MCP tools (calls the Afterhours API)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
afterhours-mcp = "afterhours_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterhours_mcp"]
