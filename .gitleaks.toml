# gitleaks: the default rules, plus one allowlist. An EVM address (0x and 40 hex characters) is
# public by definition; deployment files list them under names like "loan_token", which the
# generic-api-key rule would flag. Private keys (0x and 64 hex characters) are not matched and
# stay flagged.
[extend]
useDefault = true

[allowlist]
description = "Public EVM addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
